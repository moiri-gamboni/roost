set -g mouse on
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:Tc"
# Extended-key reporting so CC can distinguish Enter from CR inside a paste.
# https://code.claude.com/docs/en/terminal-config#configure-tmux
set -s extended-keys on
set -sa terminal-features 'xterm*:extkeys'
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -s escape-time 0
# assume-paste-time defaults to 1ms: any two key events arriving <1ms apart
# (trivial under TCP packet aggregation over et from termux) flips tmux into
# CLIENT_ASSUMEPASTING, which silently drops every key when the active pane
# is in a mode (choose-window, copy-mode). Disable so single-stroke key
# bursts aren't misclassified as paste. tmux issue #5031, source:
# server-client.c paste_key + window.c window_pane_paste.
set -g assume-paste-time 0
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on

# Propagate pane title to the outer terminal (e.g. VS Code tab title)
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# Show pane titles (set by Claude /rename) in status bar
setw -g window-status-format         "#I:#{pane_title}#F"
setw -g window-status-current-format "#I:#{pane_title}#F"

# Attended-time tracking for `session time`: log client focus flanks (VS Code
# terminal tabs forward focus via xterm focus reporting — mode 1004 — which
# focus-events above requests). Pass #{client_session} (client-scoped, the
# stable vsc-<window> tab identity) — NOT #{pane_id}, which in a client hook
# resolves against the globally-current pane and bleeds across clients during
# fast tab switches (observed). The logger resolves session→pane→Claude-sid at
# log time with ms timestamps, so every row is self-contained. client-detached
# doubles as an out so killed tabs close their span. run-shell -b: never block
# tmux on the logger.
set-hook -ga client-focus-in  "run-shell -b '~/roost/claude/scripts/session.sh --focus-mark in  #{client_name} #{client_session}'"
set-hook -ga client-focus-out "run-shell -b '~/roost/claude/scripts/session.sh --focus-mark out #{client_name} #{client_session}'"
set-hook -ga client-detached  "run-shell -b '~/roost/claude/scripts/session.sh --focus-mark out #{client_name} #{client_session}'"
