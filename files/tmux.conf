set -g mouse on
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:Tc"
# Extended-key reporting so CC can distinguish Enter from CR inside a paste.
# https://code.claude.com/docs/en/terminal-config#configure-tmux
set -s extended-keys on
set -sa terminal-features 'xterm*:extkeys'
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -s escape-time 0
# assume-paste-time defaults to 1ms: any two key events arriving <1ms apart
# (trivial under TCP packet aggregation over et from termux) flips tmux into
# CLIENT_ASSUMEPASTING, which silently drops every key when the active pane
# is in a mode (choose-window, copy-mode). Disable so single-stroke key
# bursts aren't misclassified as paste. tmux issue #5031, source:
# server-client.c paste_key + window.c window_pane_paste.
set -g assume-paste-time 0
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on

# Propagate pane title to the outer terminal (e.g. VS Code tab title)
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# The bar is for the phone and nothing else: there it is the only chrome there
# is, while every other view already names the session — VS Code labels each
# tab with the same pane title, and an SSH terminal has its own title bar. So
# it defaults off and `attach`/`agents` turn it on for the mobile client only
# (_roost_status_for_client in shell/bashrc.sh). Everything below is the format
# it uses when it is on.
set -g status off

# Status bar: the current Claude session's name (the pane title Claude sets,
# working spinner included), where it sits in the window list, and the clock.
# The other windows are deliberately not listed — `agents` (choose-window) is
# how you switch, and a dozen truncated names were unreadable on the phone.
# renumber-windows keeps the X/Y honest: without it a closed window leaves a
# gap in the indices and a 12-window session reads "15/12". Nothing depends on
# the numbers — the helpers switch by name, vsc-pin and the VS Code extension
# pin by window *id* (@N), which renumbering does not touch.
set -g renumber-windows on
set -g status-justify left
set -g status-left ''
set -g status-left-length 0
setw -g window-status-format ''
setw -g window-status-current-format ' #{pane_title} '
# Every hidden window still emits a separator, so the default single space
# indented the name by one column per window ahead of it (window 6 sat six
# columns in). Empty entries need an empty separator.
set -g window-status-separator ''
set -g status-right ' session #{window_index}/#{session_windows} · %H:%M · %Y-%m-%d '
set -g status-right-length 48

# Attended-time tracking for `session time`: log client focus flanks (VS Code
# terminal tabs forward focus via xterm focus reporting — mode 1004 — which
# focus-events above requests). Pass ONLY #{hook_client}: it is the client the
# hook actually fired for. #{client_name} is NOT — in a per-client hook it
# resolves to the command queue's current client, i.e. some other arbitrary
# attached client (verified on tmux 3.4: focus-in on pts/8 logged pts/10, and
# focus-in on pts/10 logged pts/8). Using it scrambled every flank across
# clients, leaving spans that never closed — 19 clients ended 2026-07-27 with a
# dangling "in" worth 6.6-15.3 h each. #{hook_session}/#{hook_pane} are empty
# for client hooks, so the logger resolves client→session→pane→Claude-sid at
# log time with ms timestamps, keeping every row self-contained.
# client-detached doubles as an out so killed tabs close their span. run-shell
# -b: never block tmux on the logger. Indexed hook slots ([0]) so re-sourcing
# this file overwrites instead of appending duplicates (set-hook -ga appends
# per source).
set-hook -g "client-focus-in[0]"  "run-shell -b '~/bin/session --focus-mark in  #{hook_client}'"
set-hook -g "client-focus-out[0]" "run-shell -b '~/bin/session --focus-mark out #{hook_client}'"
set-hook -g "client-detached[0]"  "run-shell -b '~/bin/session --focus-mark out #{hook_client}'"
# Window switches INSIDE one attached client (VS Code attach-main, termux/et)
# change what's on screen without any terminal-focus flank. The logger turns
# these into an "in" for the focused client viewing that session, if any —
# unfocused/background switches log nothing.
# NB #{hook_session_name}, not #{hook_session} — the latter is the numeric id,
# which list-clients -t cannot resolve (verified: handler nooped on every switch)
set-hook -g "session-window-changed[0]" "run-shell -b '~/bin/session --focus-mark switch #{hook_session_name}'"

# `main` owns no client of its own — every view is a grouped session — so when
# something kills it the windows survive under the group and nothing looks
# broken, until a second grouped view makes `-t main` ambiguous and every helper
# fails at once with "can't find session: main" (2026-08-27). Put it back on the
# spot instead. --if-attached so a teardown of the last views doesn't resurrect
# it (and with it the whole server); the guard's header has the full story.
set-hook -g "session-closed[0]" "run-shell -b '~/roost/claude/lib/tmux-main-guard.sh --if-attached'"
