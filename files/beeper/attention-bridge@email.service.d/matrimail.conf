[Service]
# The email instance runs the matrimail fork (github.com/moiri-gamboni/matrimail),
# a generic bridgev2 bridge that bbctl has no template for, so it runs as type
# bridgev2 with the binary as the startup command. bbctl passes it no
# arguments and starts it in its bridge directory, where it reads config.yaml.
# --no-override-config keeps that file across starts: bbctl's generic
# template has no gmail_oauth section, so a regenerated config would drop the
# OAuth client and every stored login would stop working.
#
# The environment file (root, 0600) holds MATRIMAIL_PASSPHRASE, which encrypts
# the stored Gmail refresh token, and MATRIMAIL_LOG_LEVEL=info. It lives
# outside the bridge directory so the key never sits beside the ciphertext;
# changing the passphrase makes every stored credential unreadable, and the
# bridge then refuses to start.
EnvironmentFile=/etc/attention-queue/matrimail.env
ExecStart=
ExecStart=$HOME_DIR/.local/bin/bbctl run --type bridgev2 --no-override-config --custom-startup-command $HOME_DIR/.local/share/bbctl/built/matrimail sh-email
