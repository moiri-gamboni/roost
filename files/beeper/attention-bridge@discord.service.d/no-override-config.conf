[Service]
# --no-override-config keeps the Discord bridge's config.yaml across starts,
# so hand edits survive: bbctl's discord template hard-codes
# bridge.backfill.forward_limits.initial.channel to 0, which leaves a guild
# channel's Matrix room without any history from before the bridge created it.
# The hand edits are listed in docs/runbooks/attention-queue.md.
ExecStart=
ExecStart=$HOME_DIR/.local/bin/bbctl run --type discord --no-override-config --custom-startup-command $HOME_DIR/.local/share/bbctl/built/mautrix-discord sh-discord
