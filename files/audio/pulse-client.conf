# The laptop's PipeWire-pulse socket, forwarded by the SSH connection's
# RemoteForward (README, Laptop tools: Voice). A file rather than PULSE_SERVER
# so processes that never sourced roost.sh find it too.
default-server = unix:/run/user/1000/pulse-fwd
autospawn = no
# Every server we reach is across a forwarded socket, which cannot carry the
# memfd/shm file descriptors libpulse offers to a "local" server: the phone's
# PulseAudio accepts them and the connection dies with "Protocol error".
enable-shm = no
