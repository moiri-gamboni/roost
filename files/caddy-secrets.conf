# Secrets for Caddy sites that gate a public route. Sites reference them as
# {env.NAME}, so no password and no hash ever reaches this repo — which is
# public.
#
# /etc/caddy/secrets.env is hand-provisioned (root:caddy 0640) and lives in no
# repo; the leading `-` makes it optional. Every variable here carries a
# deny-all default that EnvironmentFile= overrides when the file exists, so a
# rebuilt box without the secrets file still starts Caddy — the gated route
# 401s — instead of failing to load the whole config and taking every other
# site on this box down with it. Caddy rejects an empty or non-bcrypt
# basic_auth password at provision time, which is what that failure would be.
#
# A change here needs `systemctl daemon-reload` and a Caddy *restart*: a reload
# re-reads the Caddyfile inside the running process and leaves its environment
# untouched.
[Service]
# Deny-all placeholder: a well-formed bcrypt string with no preimage.
Environment=ANALYTICS_BASICAUTH_HASH=$2a$14$YdttwStIU4K0EoFEU2xV6.noPasswordHashesToThisValue0000
EnvironmentFile=-/etc/caddy/secrets.env
