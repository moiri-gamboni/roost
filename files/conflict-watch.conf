# conflict-watch — which folders are units a session can hold (files/scripts/conflict-watch.py).
#
# Paths are relative to ~/roost. `*` matches exactly one path component (fnmatch within it).
# Rules are tried top to bottom and the first match wins:
#   ignore GLOB    a path under GLOB belongs to no unit (machine-written mirrors, tool state)
#   unit GLOB      the prefix GLOB matches is the unit (a folder, or a file for a first-level file entry)
#   repos DIR      the innermost directory below DIR holding a `.git` (directory or file) is the
#                  unit, the whole repo; DIR itself never is, even when it is a repo
#   skip-name PAT… a write whose path has a component matching one of these counts for nothing:
#                  git internals (`git status` rewrites the index), caches and build state that
#                  running a tool produces, Roughdraft's pre-edit snapshots
#   skip-writer PAT  a write by a process whose command line matches (fnmatch, args joined by
#                  spaces), or by anything it runs, holds nothing: tools that rewrite many units
#                  at once on behalf of a session (a `tasks pull` touches dozens of task folders),
#                  and shared daemons whose environment names the wrong session
#   include FILE   the rules in FILE (relative to this file's directory), tried at this point;
#                  skipped when FILE does not exist
# A change reaches the daemon at its next restart and the CLI at its next call.

# Workspace-specific rules (task folders, plans, notes, data, mirrors, nested repos, and the
# writers that never hold a unit) come from the private repo, deployed beside this file.
include conflict-watch.private.conf

repos   code
repos   worktrees

# The Codex app-server daemon runs every Codex thread's edits and commands, for whichever session
# started the thread, but carries the environment of the session that started the daemon itself.
skip-writer */codex app-server *

skip-name .git __pycache__ *.pyc node_modules .venv venv .pytest_cache .mypy_cache .ruff_cache .tox .cache .roughdraft-history *.swp *~
