# Replaces Ubuntu's /usr/lib/tmpfiles.d/tmp.conf, which has the same name, so
# this file stands in for it whole. Ubuntu ages /tmp at 30 days; agent scratch
# (per-run package caches and venvs of up to ~1G each) fills the root disk
# faster than that. A file whose atime, mtime and ctime are all older than 7
# days goes at the daily systemd-tmpfiles-clean run; live Unix sockets (tmux's)
# and flock-held files are skipped. `D` still empties /tmp at boot.
D /tmp 1777 root root 7d
