# Replaces Ubuntu's /usr/lib/tmpfiles.d/tmp.conf, which has the same name, so
# this file stands in for it whole. Ubuntu ages /tmp at 30 days; agent scratch
# (per-run package caches and venvs of up to ~1G each) fills the disk faster
# than that. A file whose atime, mtime and ctime are all older than 14 days goes
# at the daily systemd-tmpfiles-clean run; live Unix sockets (tmux's) and
# flock-held files are skipped. `d`, not Ubuntu's `D`: a reboot leaves /tmp's
# contents alone, since agents keep experiment state there that a reboot should
# not wipe. Stale sockets and locks still go at boot through Ubuntu's own
# boot-only lines (x11.conf, systemd-tmp.conf).
d /tmp 1777 root root 14d
